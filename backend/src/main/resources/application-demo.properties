# Demo: a simulated Jira site and demo data, recreated on every start (DemoConfig).
tracker.today=2026-10-07
tracker.secret-key=demo-only-key-for-the-simulated-jira-token
spring.datasource.url=jdbc:sqlite:../.tmp/demo/tracker.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000&transaction_mode=IMMEDIATE
tracker.reset-database=true

# Sign-in: an embedded LDAP server with the demo users (demo-users.ldif, password "demo") on a free port.
spring.ldap.embedded.base-dn=dc=acme,dc=vn
spring.ldap.embedded.ldif=classpath:demo-users.ldif
spring.ldap.embedded.port=0
spring.ldap.embedded.validation.enabled=false
spring.ldap.base=dc=acme,dc=vn
tracker.admins=minh.hoang@acme.vn
