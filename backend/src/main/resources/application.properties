spring.application.name=tracker
spring.main.banner-mode=off
server.port=${PORT:8000}

# Database: SQLite in tracker.data-dir (override with SPRING_DATASOURCE_URL). Write transactions take the lock when they
# begin (transaction_mode=IMMEDIATE); see SqliteDataSourceConfig.
spring.datasource.url=jdbc:sqlite:${tracker.data-dir:data}/tracker.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000&transaction_mode=IMMEDIATE
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.pool-name=tracker-db

# JSON: snake_case names, enums by their value ("fullTent"), dates as ISO-8601 text
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-enums-using-to-string=true
spring.jackson.deserialization.read-enums-using-to-string=true
spring.jackson.default-property-inclusion=always

# Leave imports are limited to 5 MB: a larger file answers 413 ("The file is larger than 5 MB").
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=-1

# The built frontend is served by SpaConfig (with the single-page-app fallback); no default static locations.
spring.web.resources.add-mappings=false

# OpenAPI document of /api (springdoc), the source of the frontend's API types
springdoc.api-docs.path=/openapi.json
springdoc.api-docs.version=openapi_3_1
springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# Sessions: server-side, an HttpOnly SameSite=Lax cookie, signed out after 8 hours without a request
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Spring Boot's generated in-memory user is not used: sign-in is LDAP (or break-glass) through /api/v1/auth/login.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Sign-in: the company LDAP directory. Connection (environment variables):
#   SPRING_LDAP_URLS      e.g. ldaps://ldap.acme.vn:636
#   SPRING_LDAP_BASE      where users are searched, e.g. ou=people,dc=acme,dc=vn
#   SPRING_LDAP_USERNAME  bind DN for the user search (leave unset for an anonymous search)
#   SPRING_LDAP_PASSWORD  its password
# How users are found: TRACKER_LDAP_USER_FILTER (default (|(uid={0})(sAMAccountName={0})(mail={0}))),
# TRACKER_LDAP_MAIL_ATTRIBUTE (mail), TRACKER_LDAP_NAME_ATTRIBUTE (displayName).
# Bootstrap admins: TRACKER_ADMINS (comma-separated e-mails). Break-glass: TRACKER_BREAKGLASS_PASSWORD_HASH (bcrypt).
spring.ldap.base-environment[com.sun.jndi.ldap.connect.timeout]=5000
spring.ldap.base-environment[com.sun.jndi.ldap.read.timeout]=10000

# Operations: /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# The directory being down must not make the app unhealthy: the break-glass login still works.
management.health.ldap.enabled=false
