[project]
name = "tracker"
version = "0.2.0"
description = "Team Tracker API: Jira companion for BA teams"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "import-linter>=2.1", "pyright>=1.1.390"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracker = ["adapters/persistence/migrations/*.py", "adapters/persistence/migrations/versions/*.py", "adapters/persistence/alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["jira_live: reads a real Jira site (needs TRACKER_JIRA_* env, skipped by default)"]
addopts = "-m 'not jira_live' --basetemp=../.tmp/pytest"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]  # Starlette suggests httpx2; httpx works

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Tests read results they just asserted to exist; a None there fails the test anyway.
executionEnvironments = [
  { root = "tests", extraPaths = ["."], reportOptionalMemberAccess = false },
  { root = "src" },
]
