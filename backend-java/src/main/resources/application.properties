spring.application.name=tracker
spring.main.banner-mode=off
server.port=${PORT:8000}

# Database: SQLite in tracker.data-dir (override with SPRING_DATASOURCE_URL). Write transactions take the lock when they
# begin (transaction_mode=IMMEDIATE); see SqliteDataSourceConfig.
spring.datasource.url=jdbc:sqlite:${tracker.data-dir:data}/tracker.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000&transaction_mode=IMMEDIATE
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.pool-name=tracker-db

# JSON: snake_case names, enums by their value ("fullTent"), dates as ISO-8601 text
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-enums-using-to-string=true
spring.jackson.deserialization.read-enums-using-to-string=true
spring.jackson.default-property-inclusion=always

# Leave imports are limited to 5 MB (with the API's own message); the servlet limits sit just above.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
server.tomcat.max-swallow-size=-1

# The built frontend is served by SpaConfig (with the single-page-app fallback); no default static locations.
spring.web.resources.add-mappings=false

# OpenAPI document of /api (springdoc), the source of the frontend's API types
springdoc.api-docs.path=/openapi.json
springdoc.api-docs.version=openapi_3_1
springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# Operations: /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
