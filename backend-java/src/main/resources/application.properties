spring.application.name=tracker
spring.main.banner-mode=off
server.port=${PORT:8000}
# Uploads: leave imports are limited to 5 MB by the API (with its own message); the servlet limits sit just above.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
server.tomcat.max-swallow-size=-1
# Static files are served by StaticFrontend (SPA fallback); no default resource mappings.
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false
server.error.whitelabel.enabled=false
